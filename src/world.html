<script src="assets/js/intro.js"></script><script src="assets/js/heroloop.js"></script><script src="assets/js/seoulmap.js"></script><script>
const WORLD = {
  title: '瑞門',
  sub: '경계의 도읍, 서문 가문에 대하여',
  lead: '그들은 인세의 음지에 서서\n인간의 눈으로 볼 수 없는 것을 처리하고 평안을 기도한다',
  prologue: `이것은 천사감 서고의 가장 깊은 칸에 꽂혀 있던 기록이다. 누가 썼는지는 남아 있지 않다. 다만 마지막 장에 이렇게 적혀 있었다 — "이름을 지킨 자도, 잃은 자도 모두 여기 적는다."`,
  prologueBy: '— 무명의 기록자',

  stories: [
    { han: '門', vol: '卷一', title: '서녘의 문', intro: 'assets/video/west.mp4', teaser: '산 자의 땅과 죽은 자의 땅 사이, 해가 지는 곳에 난 문을 지키는 신이 있었다.',
      body: `조선 숙종 연간, 한강 서쪽 나루 어귀에 단(丹)이라는 이름을 지닌 무녀가 살았다. 열두 살에 시작된 신병을 꼬박 일곱 해 앓다가 성인으로 향하는 섣달그믐에야 신을 받았다. 여자의 주춧돌이 된 신은 무당들 사이에서도 입에 올리기를 금하는 존재였다. 산 자의 땅과 죽은 자의 땅 사이 해가 지는 곳에 난 문을 지킨다는 신. 사람들은 감히 그 이름을 부르지 못하고 그저 서녘님이라 일컬었다.

서녘님을 모시는 무당은 하나같이 미쳐 죽거나 스스로 목숨을 끊는 것이 정설이었다. 그렇기에 단은 서녘님을 모시며 최초로 살아남은 이였다. 여자는 신을 입맛대로 주무르기에 앞서 피를 나누기를 원했고, 그 결과로 핏줄에 대대로 서녘님이 깃들게 되었다. 단이 굿을 치르는 날이면 한양 서쪽 하늘에서 까마귀 떼가 흩어졌고 방울을 흔들면 저승의 문틈으로 새어 나오던 것들이 비명을 지르며 물러났다. 사람들은 여자를 서쪽 문의 무당, 서문이라 명했으며 천한 무녀였던 여자는 서문을 성으로 삼은 그녀가 되었다.

무당의 집안이 대를 이어 살아남는 일은 드물었다. 조정은 때로 그들을 찾았고 씹은 뒤 내쳤다. 나라에 역병이 돌면 서문을 불러 굿을 올렸으나, 역병이 걷히면 요사스러운 무리로 여기며 도성 밖으로 내몰았다. 서문이라는 성을 지닌 모두는 과업을 흘리듯 묵묵히 견뎠다. 쓰임과 버림을 오가는 동안 그들은 단 한 번도 자리를 비운 적이 없었다.

나라의 사정이 기울고 남의 손에 금이 가던 시절 서문은 땅 밑으로 숨어들었다. 무속을 미신으로 취급하며 죽어라 짓밟던 시절을 등으로 버텼다. 굿판은 산속 깊은 곳으로 사라졌고 북소리는 낮아졌으며 많은 핏줄이 곯거나 중병을 앓아 목숨을 잃었다. 내일의 해가 뜬 뒤 살아남은 서문은 손에 꼽을 만큼이었으나 피는 가늘게나마 이어졌고, 그 가느다란 피가 훗날 가장 굵은 줄기를 틔웠다.

전쟁과 가난, 목을 꺾는 군홧발이 지나간 후에도 서문은 여전히 세상의 그늘에 머물렀다. 생존과 습관 사이에 안주하고 있던 그들을 재차 볕 아래로 끌어낸 것은 한 사람이었다. <서문 단> 이래 가장 강한 피라 일컬어지는 사내, 지금의 서문을 만든 조부였다.

조부가 신을 받던 날, 서녘님이 깃든 몸에서 흘러나온 기운이 너무 거세 굿판을 둘러싼 인부들이 모조리 각혈하였다고 한다. 그는 채 서른이 되기 전 가문의 모든 어른을 넘어섰고, 마흔 줄에 이르러서는 이 땅 어느 무당도 그와 견줄 수 없게 되었다. 평년보다 포근했던 1997년 겨울, 새 대통령이 당선되던 밤, 서문은 나라의 중추에 발을 들이게 된다.

그날 이후 국운이 걸린 모든 갈림길에는 서문의 그림자가 드리웠다. 나라가 휘청이던 해, 큰 재난이 닥친 날, 바다 건너의 손님을 맞이하는 자리에도 서문은 늘 보이지 않는 곳에 있었다. 나라의 일이 곧 서문의 일이었고, 서문의 일 또한 나라가 함께 짊어졌기에 공과 사를 가리지 않았다. 기록 어디에도 성은 남지 않았으나, 이 나라의 지난 서른 해 중 서문의 손때가 묻지 않은 곳이 없다.` },
    { han: '血', vol: '卷二', title: '피의 법도', teaser: '서문의 힘은 배워서 얻는 것이 아니다. 오직 피로만 이어진다.',
      body: `서문의 힘은 배워서 얻는 것이 아니다. 오직 피로만 이어진다. 서녘님은 서문 단과 피를 나눈 자에게만 깃들며 그 피가 묽어질수록 신은 멀어진다. 바깥의 피가 섞일 때마다 힘은 눈에 띄게 줄어들었고, 세 대를 내리 바깥 사람과 맺은 핏줄은 끝내 신의 목소리를 듣지 못했다.

그렇기에 서문은 오래전부터 겹혼(疊婚)이라는 법도를 지켜 왔다. 가까운 핏줄끼리 혼인을 맺어 피를 거듭 겹치는 것. 외간의 시선으로 보기엔 차마 입에 담기 어려운 일이었으나 서문에게는 신을 붙들 마지막 방책이었다. 가주와 그 직계는 반드시 서문의 피를 가진 이와 혼인해야 했고, 바깥 사람을 들이는 일은 오직 가문 내의 정략으로만, 그것도 손에 꼽을 만큼만 허락되었다.

당연하게도 피를 겹칠수록 몸은 약해졌다. 서문의 아이들은 태어나기도 전에 스러지는 일이 잦았고, 태어나더라도 돌을 넘기지 못하는 일이 흔했다. 피가 귀하니 손이 귀했으며 손이 귀하니 피는 더욱 귀해졌다. 서문에게 아이 하나는 곧 가문의 한 해. 그 아이가 신을 받는 날은 집안의 잔칫날이었다. 첩실의 자식이든 버려진 핏줄이든, 신의 목소리를 들을 수 있다면 끝내 서문의 이름 아래로 거두어들인 것도 그 때문이다.

신과 소통하는 힘을 요긴하게 사용해 온 국가는 그 피를 지키기 위해 전라남도 땅 한 자락을 통째로 내어 주었다. 월출산 서쪽 기슭에 자리한 그곳을 서문 사람들은 문안(門安)이라고 부른다. 문 안쪽, 가장 안전한 땅이라는 뜻이다. 지도에는 국가 보호 구역으로 표시되어 있고, 허락받지 않은 이는 들어갈 수도 나올 수도 없다. 서문의 아이들은 대부분 그곳에서 태어나고, 그곳에서 신을 받으며, 그곳에 묻힌다.

또한 서문의 이름을 가진 자는 누구든 이 나라를 떠날 수 없다. 이민은 물론이고 바다 건너로 나가는 일조차 닷새를 넘길 수 없다. 서녘님은 이 땅의 신이라, 땅을 오래 떠난 몸에서는 신이 떨어져 나가기 때문이다. 출국할 때마다 나라에 사유를 알려야 하고, 엿새째 되는 날까지 돌아오지 못한 피는 가문에서 없는 것으로 친다. 지금껏 그 법도를 어기고 돌아온 이는 단 하나도 없다.

귀한 피라는 말은 곧 묶인 몸이라는 뜻이다. 서문은 이 나라의 가장 높은 곳에 앉아 있으나, 그 누구보다 좁은 울타리 안에 갇혀 산다. 그들은 나라를 수호하는 대가로 나라에 묶였고, 서문 사람들은 그러한 종속을 영광이라 배운다.` },
    { han: '魎', vol: '卷三', title: '굴지의 서문', haunt: true, teaser: '평범한 사람의 눈에는 보이지 않으나, 그것들은 사람의 피와 넋을 먹고 자란다.',
      body: `이 세상에는 귀신이라 불리는 망량(魍魎)이 있다. 악신이 엉겨 붙은 물건이나 인간의 가장 약한 틈에서 비집고 나온 것, 이름으로 명할 수 없는 오래된 것들. 평범한 사람의 눈에는 보이지 않으나 그것들은 사람의 피와 넋을 먹고 자란다. 까닭 모를 병, 끊이지 않는 사고, 한 집안이 대를 이어 몰락하는 일 속에서 결코 적지 않은 것이 그들의 짓이다.

망량을 쫓는 이들은 서문 말고도 많다. 신과 계약을 맺고 그 힘을 빌려 쓰는 퇴마사들 또한 있으며 바깥에서는 이들을 계약자라 부르기도 한다. 그들은 저마다의 신에게 수명이나 오감, 혹은 소중한 무언가를 내어 주고 힘을 얻는다. 계약자의 힘은 계약의 크기만큼이며 대가를 전부 치르는 날 그들은 신에게 거두어진다.

서문은 다르다. 그들은 신과 계약하지 않는다. 신이 이미 피 속에 있기 때문이다. 서문의 유전을 타고난 이는 하나도 빠짐없이 망량을 보고, 듣고, 꺾는다. 계약자들이 평생을 바쳐 닿는 경지를 서문의 아이는 열 살 남짓에 넘어서기도 한다. 그래서 이 바닥 사람들은 그들을 두고 견줄 데 없는 이름이라며 굴지의 서문이라 부르기도 한다.

서문의 퇴마는 피에서 시작해 피로 끝난다. 그들은 피를 바탕으로 신과 합치될 때 소지품 하나를 자신의 생명 대신 공양하는데, 그것을 몸처럼 소중히 여겨야만 신과의 계약이 이어진다. 또한 가문의 신주에 모시고 있는 작두는 대대로 물려 내려온 것으로, 칼날에 새겨진 이름이 늘어날 때마다 도신이 더더욱 무거워진다고 한다. 가장 강한 서문은 굿판도 부적도 없이 손끝으로 망량을 흩어 버리는데 지금껏 그 경지에 이른 이는 시조 단과 조부, 단 둘뿐이었다.

물론 그 힘에도 값은 있다. 힘을 쓰는 만큼 몸은 깎여 나가고, 신을 깊이 들일수록 사람의 경계가 옅어진다. 늙은 서문들 가운데 생기 있는 이가 드문 것도 그 때문이다. 서문 사람들은 이를 두고 우리의 사지 육신은 신에게 올리는 굿의 제물일 뿐이라 한다.

경파 또한 이 힘을 떠받든다. 염가를 비롯한 여러 분가는 본가만큼의 피를 가지지 못했으나, 서문이 미처 손쓰지 않는 자잘한 망량을 꺾어 내고 퇴마 후에 남은 흔적을 지우며 바깥 세상의 눈을 가린다. 본가가 문을 닫는다면 분가는 그 문 앞을 쓸고 닦는 자들이다.` },
    { han: '月', vol: '卷四', title: '문이 열리는 한 달', teaser: '사십구재를 마무리하기 전까지 새 가주가 결계를 세우지 못하면, 다시는 문을 닫을 수 없다.',
      body: `국가 전체가 서문의 비호 아래 있다고 해도 과언이 아닌 지금, 조부는 평생에 걸쳐 도성 둘레에 결계를 쳤다. 옛 사대문과 한강의 다리들, 도시 곳곳의 오래된 고목과 관광지가 모두 그 결계의 말뚝이다. 결계는 우리의 밤을 이불처럼 덮어 가며 이승 너머의 삿된 것들이 감히 출입하지 못하게 막아 왔다. 당연하게도 결계는 조부의 목숨에 묶여 있었다. 그가 숨을 쉬는 동안 결계도 숨을 쉬었고, 그의 피가 도는 동안 모두의 밤도 고요했다. 그러니 조부가 숨을 거둔 지금, 결계를 붙들고 있던 손은 사라졌다.

신의 셈법에 따르면 결계는 단번에 무너지지 않는다. 주인을 잃은 결계는 한 달에 걸쳐 서서히 풀려 나가기에 그와 비례하게 망량이 오갈 틈 또한 켜켜이 넓게 열린다. 해가 뜨기 전 가장 어두운 시간, 서울은 문 너머의 것들 앞에 맨몸을 드러낸다. 사십구재를 마무리하기 전까지 새 가주가 결계를 세우지 못하면 다시는 문을 닫을 수 없다.

장례는 끝났다. 상복도 벗었고 위패도 모셨다. 그러나 서문 사람들은 입을 모아 말한다. 진짜 사십구재는 지금부터라고. 이승을 떠난 넋이 마흔아흐레 동안 심판을 받듯 서문의 모든 이들은 진정한 시험을 받게 된다. 누가 그 문을 닫을 것인가. 누가 조부의 자리에 앉을 것인가. 피가 귀한 집안에서 피를 이어 가진 자는 누구든 쓰임이 있다. 그것이 축복인지 저주인지는, 조부의 피가 완전히 식은 뒤 알 수 있을 것이다.

~ 새벽이 온다.
문이 열리기 시작했다.` }
  ],

  // 가문 — list: 목록 이름 / items: 누르면 창이 떠요 (body 를 비워 두면 제목만 있는 빈 창이 떠요)
  regions: [
    { han: '瑞', hj: '瑞門', dir: 'MAIN HOUSE', name: '본가', tone: 'crimson', moods: ['엄숙', '규율', '명예'], list: '선점',
      text: `서문의 뿌리이자 가장 굵은 줄기, 그것을 본가(本家)라 부른다. 서문 단의 피를 가장 곧게 물려받은 이들은 나라가 하사한 땅 한 자락에서 나고 자라며, 그것을 영광으로 안은 채 죽는다.

*

전남광주특별시 서쪽 기슭은 그들의 땅으로 경계가 몇 번이고 다시 그어지는 동안에도 그곳만은 한 뼘도 줄지 않았다. 본가는 서녘님을 모시며 국운이 걸린 망량에만 손을 댄다. 그보다 작은 것은 애초에 그들의 몫이 아니다. 나라가 내리는 것은 받되 값을 셈하지 않고, 의뢰를 품삯이 아닌 소임이라 부른다. 그들을 움직이는 것은 오직 명예와 가주의 말뿐이다.

*

가주가 옳다 하면 옳은 것이고, 그르다 하면 그 자리에서 그른 것이 된다. 이러한 사상은 양육 방식에도 그대로 이어진다. 본가의 아이들은 기른다 하지 않고 벼린다고 한다. 쇠를 달구어 두드리듯 아이는 말보다 먼저 신의 목소리를 배우고 걸음보다 먼저 신당의 냉기를 익힌다. 다섯 살에 신기를 드러내야 하고, 열 살에는 하급 망량 하나쯤은 홀로 제령할 줄 알아야 한다. 그사이에 이루어지는 일을 바깥 사람이 보았다면 훈육이라 부르지 못했을 것이다. 굶김과 매, 망량이 우글대는 폐가에 아이를 홀로 두고 밤새 문을 걸어 잠그는 일까지. 벼림을 견디지 못한 아이의 이름은 족보에 오르지 않으며 소리 소문도 없이 생의 불씨를 꺼뜨린다. 가문에서 각출되었다고 하여 다른 피로 스미게 둘 수는 없다. 나라가 유전의 반출을 엄격히 다스리기 때문이다.

*

이 모든 억압을 견디게 하는 것은 세뇌에 가까운 가르침이다. 본가의 아이들이 옹알이를 채 떼기도 전에 가장 먼저 외는 문장이 있다. ==가문은 일족이며, 군락이고, 나 자신이다.== 본가는 서문 가운데서도 고귀함의 정점에 선다. 그들은 태어나는 날조차 제 것이 아니다. 잉태의 밤도 첫 울음의 새벽도 신의 셈법에 따라 미리 점지된다. 신의 뜻으로 빚어진 몸은 죽어서도 땅을 더럽히지 않기에, 본가 사람이 묻힌 자리는 무덤이 아닌 성역으로 여겨진다.

*

그러니 본가에게 울타리는 감옥이 아니다. 고결한 것은 스스로를 가두어야 고결함을 지킨다는 것을 그들은 누구보다 먼저 배운다. 발톱이 없는 것이 아니다. 다만 거두었을 뿐이다. ==본가의 담은 바깥의 것을 막기 위해 쌓인 것이 아니다. 안의 것이 새어 나가지 않기 위해 쌓였다.==`,
      items: [
        { title: '불륜의 씨앗', body: `서문 도현은 머지않아 집안의 대들보가 될 사내로 어딜 가든 우러름이 따라붙었다. 그러나 그 이름 뒤편에는 족보에 끝내 오르지 못한 곁가지가 둘 있었다. 어미의 성을 물려받은 탓에 '서문'을 남의 것인 양 바라보기만 하던 아이들. 둘이 처음 본가의 문턱을 넘은 건 할아비가 숨을 거두던 날이었고, 그날 이후 아무도 입 밖에 내지 않은 채 서문의 씨로 갈무리되었다.

몸이 쇠약하여 아이 하나 겨우 품은 첫 아내가 곧 내쳐질 것이라고 수군대는 이들이 있었다. 세상 물정에 어두운 넘겨짚기다. 그녀는 국무총리의 유일무이한 금지옥엽이었고, 첩들이 가택의 앞뜰에 발끝 하나 디디지 못하는 것도 그녀의 서슬 덕이었다.

그녀가 첩의 아이들을 없애려 지금껏 칼을 벼린다는 뜬소문도 돌았다. 하지만 나이를 가늠하기 어려울 만큼 앳된 웃음과 사계절 내내 오색으로 물들인 불시개화 차림을 본 이들은 단호히 고개를 저었다. ==소문은 소문일 뿐이라고.==

이렇게나 사랑스러운 그녀의 손날에 떠밀린 당신이 저승 문턱에서 기어 돌아왔다 한들 달라지는 건 없다. 그녀의 끝동을 베어 쥐면 당신의 목을 달기에 알맞은 둘레일 테다. 한낱 구설에 귀 기울일 이는 이승에 없고, 팔다리는 여자의 속에 돋은 잔가지일 뿐이니.` },
        { title: '이름 없는 아이', body: `서문 강오가 무슨 까닭으로 호적에서 지워졌는지는 아무도 알지 못했다. 귀신과 정을 통해 자식을 보았다는 말까지 떠돌 만큼 그는 오직 사람들의 입끝에서만 숨이 붙어 있던 이름이었다. 그렇게 집을 등진 지 열 해.

어느 날, 윤옥란의 손을 잡은 사내아이 하나가 서문 강오의 아들이라는 이름을 달고 본가의 문턱을 밟았다. 날 선 눈길이라도 닿았더라면 처지가 달랐을까. 불청객을 대접할 이가 없어 윤옥란의 시녀들 손에서 자라다시피 했고 열두 살 이후로는 교문조차 넘어 본 적이 없었다. 본가에 몸을 두었으나 떠도는 먼지만도 못한 삶이었다.

누구도 그를 식구라 칭하지 않았고 핏줄 또한 그를 피붙이로 여기지 않았다. ==불러 줄 이름마저 지워진 아이.== 그런 그에게 '서문'이 주어진 것은, 할아비가 숨을 거둔 뒤 펼쳐진 유언장 속 단 한 줄 덕분이었다.

이제야 너를 내 핏줄로 받아들이겠노라는 한마디. 그 한 줄이 고인 채로 썩어 가던 그의 피에 비로소 물길을 그었다.

바라든 바라지 않든 이제 당신은 서문의 핏줄이다. 죽어 문드러질 묘지조차 그들의 그늘을 벗어날 수 없으리라.` }

    { han: '誓', hj: '誓門', dir: 'GYEONGPA', name: '경파', tone: 'navy', moods: ['번화', '향락', '실력주의'], list: '서울 소유지', map: 'seoul',
      text: `경파(京派)는 본가에서 갈라져 나온 한 뿌리로 혈통으로 따지자면 본가에 견주어 모자랄 것이 없다. 다만 그들은 본가를 향해 고개를 숙이지 않는다. 명예에 목을 매지도, 일가의 이름에 생을 내어 주지도 않으며 오직 제 손에 쥐여질 것을 위해 움직인다. ==본가 사람들은 그들을 두고 피를 팔아 먹는 자들이라 하고, 경파 사람들은 본가를 두고 피에 팔려 간 자들이라 한다.==

갈라섬의 시작은 사소한 다툼이었다. 서문백의 동생, 서문태준은 가주를 정하는 자리에서 이렇게 말했다고 한다. 서녘님께 받은 힘은 축복이며 선물이나, 그것은 나라님의 것도 가주의 것도 아니니 높고 낮음을 가리지 않고 값을 치르는 모두에게 고르게 나누어져야 한다. 본가의 어른들은 그 말을 불경이라 했고, 그는 그날 밤 제 식솔을 이끌고 서울로 올라갔다. 이후 그를 따르는 피들이 하나둘 문을 나섰다. 서울 경(京) 자를 써 경파라 부르게 된 것도 그 때문이다.

본가가 나라의 부름에만 응한다면 경파는 값을 치르는 누구의 부름에든 응한다. 재벌가의 대물림 저주부터 동네 원룸에 붙은 잔귀까지, 의뢰의 크고 작음은 그들에게 액수의 차이일 뿐이다. 본가가 손댈 가치조차 없다 여긴 망량들이 이 나라에서 가장 많은 사람들을, 평범하고 안락한 삶을 갉아먹는다는 것을 경파는 누구보다 잘 안다. 그들이 돈을 받고 퇴마하는 일을 수치로 여기지 않으며 가장 정직한 공양이라 믿는 까닭이 이러한 가르침에 있다.

또한 경파의 사람들은 퇴마만으로 살지 않는다. 크게는 국회 의석에, 작게는 손바닥만 한 화면 속에 그들이 있다. 남의 운이 기우는 것을 먼저 보고 사람 곁에 붙은 것을 먼저 읽는 눈은 어느 바닥에서든 쓸모가 있다. 법도는 단 하나, 민간인에게 들키지 않을 것. ==서녘님의 힘을 쓰되 그것을 힘이라 말하지 않는 것.== 그리하여 우리는 서녘님에게 물려받은 신의 피를 재능이라 부르고, 운이라 부르고, 감이라 칭한다.

경파의 가르침은 자유로워 아이의 운명을 가문에 묶어 점지하지 않는다. 아이들은 스물이 되기 전부터 제 밥벌이를 고민하고, 제 힘으로 서울에 방 한 칸을 얻는 날을 기쁨으로 여긴다. 그래서 경파는 가족이라기보다 공동체에 가깝다. 피로 묶인 것은 같으나 서로에게 무엇도 강요하지 않으며, 제 앞가림을 하는 한 누구도 누구의 삶에 간섭하지 않는다.

물론 그 자유에도 값은 있다. 경파는 겹혼의 법도를 본가만큼 지키지 않았고, 바깥 사람과 맺어진 핏줄은 대를 거듭할수록 묽어졌다. 끝내 신의 목소리를 듣지 못하는 아이가 해마다 늘어 가는 것을 그들도 알고 있다. 다만 입에 올리지 않을 뿐이다.`,
      items: [] },
    { han: '染', hj: '染家', dir: 'BRANCH', name: '분가', tone: 'lilac', moods: ['분가', '하시', '단절'], list: '선점',
      text: `염가(染家)의 시작은 버려진 아이들이었다. 해를 거듭하며 서녘님의 힘이 옅어지고 이 삿된 땅에서 인간의 거죽을 쓴 이들이 망량과 다를 바 없이 행동할 때, 귀한 피를 받고도 채 삭이지 못하는 아이들이 드물지 않게 태어났다. 그렇다고 내치자니 피가 바깥으로 새어 나갈 것이 두려웠던 옛 가주들은 머리를 맞대었고, 그들을 한데 거두어 새 성을 내린 것이 오늘날 분가의 시작이 되었다. 염가는 본가와 경파 사이 어딘가에 서 있다. 피의 법도와 위아래를 따르는 성질은 본가를 닮았으나, 세상의 그늘에 숨어 사는 것을 미덕으로 여기지는 않는다. 그들이 바라는 것은 일반인의 정점이다.

서문이 미처 손대지 않는 자잘한 망량을 꺾고, 퇴마 뒤에 남은 흔적을 지우고, 바깥세상의 눈을 가리는 일은 대대로 그들의 몫이었다. 다만 그것을 본분으로 두되, 세상의 눈에 보이는 자리에서도 가장 높은 곳에 서기를 원한다. 그래서 염가의 적통이 퇴마가 아닌 다른 길을 꿈꾼다면 집안은 그 꿈을 아낌없이 밀어준다. 음악이든 운동이든 학문이든 상관없다. 염가 출신 가운데 이름만 대면 알 만한 이들이 적지 않은 것도 그 때문이다. 본가의 아이들이 신당의 냉기 속에서 자랄 때, 염가의 아이들은 수입 차와 명품, 이름난 가정 교사들 사이에서 자란다. 본가에서는 꿈조차 꿀 수 없는 사치다. 그 자유로움 때문에 서문의 아이들은 어린 시절 한 번쯤 염가를 부러워한다. 굶지도 맞지도 않고, 원하는 것을 원한다고 말할 수 있는 아이들.

그러나 그 시선은 본가의 경조사에 함께 서는 날 끝이 나고 만다. 서문의 마당에서 염가는 본가의 얼굴을 함부로 바라볼 수 없다. 자리는 늘 말석이고, 말은 묻기 전에 꺼내지 않으며, 고개는 본가의 그림자가 지나간 뒤에야 들 수 있다. 숨 한 자락까지 본가의 손아귀에 놓여 있는 생이었다. 또한 염가 안의 크고 작은 행사들은 본가의 허락 없이는 제 뜻대로 치를 수 없었다. 아이의 탄생부터 장례까지, 모든 날짜는 본가보다 열등하도록 점지된다. 염가 따위가 본가와 본적을 나란히 하는 일은 꿈조차 꿀 수 없다.

염가가 그 방식에 수긍하는 것은 아니다. 다만 입을 다물고 있을 뿐이다. 분가 안에도 본가의 아이들쯤은 가볍게 꺾을 만한 실력자가 있다. 그럼에도 그들은 결코 앞에 서지 않는다. 아무리 강해도 분가는 분가이기 때문이다. ==태어난 자리가 곧 앉을 자리라는 것을, 염가는 본가보다 더 철저히 배우며 자란다.== 허나 고개를 숙인 채 삼킨 모멸은 사라지지 않는다. 그것은 뱃속에서 곪아 들고, 곪은 것은 끝내 가장 낮은 곳으로 흘러내린다.

염가에는 염업(染業)이라는 제도가 있다. 적통이 아닌 핏줄로 태어난 것은 그 자체로 갚아야 할 업이라는 뜻이다. 첩실의 자식, 방계의 자식, 바깥 피가 섞인 자식은 모두 이 업을 지고 태어나며, 적통의 아이들은 그들을 제 시종처럼 부린다. 대신 망량 앞에 세우고, 대신 매를 맞게 하고, 대신 궂은 일을 하게 한다. 해마다 소리 소문 없이 족보에서 지워지는 식솔이 있다는 것은 염가 안의 누구도 입에 올리지 않는 사실이다. 이 모든 것은 법이 아니다. 그러나 본가가 눈을 감아 주는 한 법보다 단단한 가율로 행해진다. ==위에서 짓밟힌 자가 아래를 짓밟는 일에 대해, 조부는 단 한 번도 말을 보탠 적이 없다.==

이 염증을 제 손으로 도려내기 전까지, 염가는 결코 본가에 견줄 수 없을 것이다.`,
      items: [
        { title: '염업', body: `염가는 서문의 뒤를 닦기 위해 존재하는 분가로 남의 그림자 아래 엎드려 사는 집안에서조차 선이 그어진 染業들의 삶이 어떠할지는 굳이 말할 필요도 없을 것이다. 염업. 사람들은 그들을 염업이라 불렀다. 염가의 수치, 염가가 짊어진 업보라는 뜻이었다.

본가와 분가 사이에 이불을 깔았으나 어미도 아비도 모르는 아이들이라는 말이 있었고, 염태율이 여기저기 흘리고 다닌 씨라는 말도 있었다. 셀 수 없는 풍문으로도 그들이 어디에서 굴러 들어왔는지는 명백히 짚어 내기 힘들었다.

그들은 사람 대접은커녕 키우는 가축만도 못한 취급을 받으며 하루하루를 생했다. 염태율의 자식들 곁에 시종처럼 붙어 온갖 궂은일을 떠맡았고 그 아이들이 잘못을 저지르면 대신 매를 맞았다. 술력을 시험할 몸이 필요할 때면 가장 먼저 끌려 나가는 것도 그들이었다. 기쁠 때나 슬플 때나 간지러운 매질과 화풀이를 감당하는 것이 밥값이었다.

서문은 그 모든 것을 알고 있었다. 알면서도 손을 뻗지 않았다. ==까닭은 하나, 그들에게 내어 줄 시선조차 아까웠기 때문이다.==

그러던 염업들이 처음으로 서문가 장례의 말석에 공여하게 된 것은 돌연 조부가 남긴 유언 덕이었다. 염업 또한 일족으로 거두겠다는 간단한 치레. 의중 모를 변덕으로 그들은 서문의 문턱을 밟을 수 있게 되었다.

탄생 이래 웃음과 울음을 구분하기 어려웠었지. 이제 당신의 얼굴을 더듬어 보자. 입꼬리의 각도, 파인 볼이나 축축한 눈가 따위를. 누군가에게는 평생을 빌어 온 염원일 테고 다른 누군가에게는 오래 묵은 증오를 매장하는 날일 것이 분명했다.` }
      ] },
    { han: '他', dir: 'OTHERS', name: '기타', moods: [], list: '세 가문',
      text: `윤가(尹家), 현가(玄家), 독고가(獨孤家). 세 가문은 서문과 어깨를 나란히 두는 국가 공인 퇴마 가문으로 오랜 세월 나라의 음지에서 망량을 다스려 왔다. 서문이 신의 뜻과 혈통을 앞세운다면 이들은 인간의 의지와 술법을 내세운다. 다루는 금술도, 섬기는 법도도 서로 다르나 바라는 것은 하나다. ==서문이 독점해 온 나라의 신임과 그 자리를 빼앗는 것.==

그렇다고 이들이 언제나 서문의 적인 것은 아니다. 망량 앞에서는 같은 편에 서고, 나라에 큰 화가 닥치면 서로의 등을 맡기기도 한다. 다만 싸움이 끝나고 칼을 거두면 이야기는 달라진다. 서문이 지키려는 자리를 세 가문은 호시탐탐 노리고 있으며 오래 묵은 경쟁심은 이제 적의에 가깝다. 나라에서는 그들 모두를 같은 퇴마사라 부르지만 정작 그들 사이에는 누구도 입에 올리지 않는 서열이 있다.

윤가는 사람의 명을 빌리고, 현가는 몸 안에 고를 기르며, 독고가는 남의 꿈을 짓는다. 세 가문 모두 사람을 구하는 술법으로 이름을 얻었으나, 사람을 해하는 법에도 그만큼 능하다. 무엇으로 사람을 구했는지보다 무엇을 대가로 받았는지는 좀처럼 알려지지 않는다. 그러나 조부의 죽음이 그들의 귀에 들어가는 날, 지금껏 서문 앞에서 거두어 두었던 송곳니가 어느 쪽을 향할지는 누구도 장담할 수 없다.`,
      items: [
        { title: '尹家', body: `이들은 본디 사람을 살리는 의술을 행하는 주술사로 알려져 있었다. 살릴 수 없는 것을 살리고, 돌아올 수 없는 것을 돌아오게 하며, 죽을 날을 받아 놓은 이에게도 기꺼이 손을 내미는 것이 그들의 가훈이자 오랜 명예였었다. 받은 것은 갚고, 빌린 것은 돌려줄 것. 윤가의 사람들은 이를 사람 사는 도리라 부르며, 그 도리를 저버리는 자를 짐승만도 못하다 여긴다. 다만 그들이 말하는 빌림에는 기한이 없고 갚음에는 반드시 목숨이 따른다는 사실을 아는 이는 많지 않다.

윤가가 다루는 것은 차명이다. 사람의 명을 잠시 빌려 다른 이에게 붙이는 술법으로, 오래전에는 죽어 가는 자를 살리는 데 쓰였다. 명이 다한 아이에게 어미의 남은 수명을 조금 나누어 주거나, 숨이 끊어져 가는 남편에게 아내의 생기를 덧대는 식이었다. 그때에는 빌리는 자도 빌려주는 자도 제 뜻을 알고 있었다. 그러나 사람이 살고자 하는 욕심에 끝이 없듯, 남의 것을 탐하는 데에도 끝이 없었다. 윤가는 어느 날부터 허락을 구하지 않았다. 빌려주는 자가 모르는 편이 도리어 자비롭다는 것이 그들의 생각이었다.

그들이 술법을 행할 때 쓰는 것은 종이로 오린 사람의 형상이다. 이름과 생시를 적은 종이에 사람의 액을 옮겨 흘려보내던 옛 풍습을 거꾸로 뒤집어, 액이 아니라 명을 거두는 데 쓰는 것이다. 윤가의 형대는 언제나 깨끗한 흰 종이로 만들어진다. 종이가 더럽혀지면 빌려 온 명에도 흠이 생긴다고 믿기 때문이다. 그렇게 거둔 명은 집안 깊숙한 곳에 보관하며, 빌려준 사람이 죽어도 함부로 태우지 않는다. ==육신이 죽었다고 하여 빚마저 사라지는 것은 아니므로.==

현 조부의 아내인 윤옥란이 가문의 장녀로 서문에 혼인을 온 이후 사돈으로 맺어진 그들에게도 휴식이 찾아왔으나, 조부가 죽은 지금에서는 윤가가 서문 본가 자리를 탐내고 있다는 건은 기실상부 누구나 아는 이야기다.` },
        { title: '玄家', body: `현씨 가문에서는 사람이 죽어도 곡을 하지 않는 풍습이 있다. 태어날 때 이미 죽을 몫을 지니고 나왔으니 그것이 다하였다고 슬퍼할 이유가 없다는 것이다. 다만 시신에 벌레가 꼬이지 않는다면 사흘 밤낮으로 곡한다. 제 몫을 다하지 못한 육신에는 벌레 한 마리도 깃들지 않는다고 믿기 때문이다.

그들이 대대로 다루는 것은 고독이며 본디 수많은 독충을 한 그릇에 가두어 서로를 잡아먹게 한 뒤 마지막에 남은 것을 주술의 매개로 삼는다는 옛 금술이다. 현가에서는 이를 양고라 부른다. 기른다는 뜻이다. 그들은 벌레를 부리는 것이 아니라 기른다고 하며 부리는 것은 종에게나 하는 짓이라고 여긴다. 고는 주인을 섬기는 짐승이 아니다. 제 살을 내어 주고 제 살을 받아먹는 또 하나의 혈육이다.

현가의 아이들에게는 저마다 하나의 고가 붙으며 모두 동복으로 여긴다. 사람의 아이는 어미의 배에서 나왔으나 고는 그 아이의 몸을 제 배로 삼으니, 둘은 서로 다른 곳에서 태어나 한 몸으로 자라는 형제가 된다. 동복을 얻은 아이는 홀로 잠들지 못하고, 홀로 밥을 먹지도 못한다. 사람의 입이 먹지 못하는 것을 고가 먹고, 사람의 귀가 듣지 못하는 것을 고가 듣기 때문이다. 밤마다 아이들의 침소에서는 작게 무엇인가를 갉아 먹는 소리가 난다. 어른들은 그것을 유치가 나는 소리라 한다.

고의 모습은 저마다 다르다. 어떤 것은 사람의 귀 뒤에 희고 작은 알을 붙이고, 어떤 것은 혀 밑에 몸을 감추며, 어떤 것은 주인의 그림자 속에서만 날개를 편다. 현가에서 가장 귀하게 여기는 것은 사람의 눈에 보이지 않는 고다. 보이지 않는다고 하여 없는 것이 아니다. 보이지 않을 만큼 깊숙이 들어간 것이다. 한 번 몸에 깃든 고는 숙주의 기쁨과 슬픔을 먹고 자라며, 자란 만큼 숙주가 지닌 것을 조금씩 제 것으로 삼는다. 처음에는 입맛이 바뀌고, 다음에는 잠버릇이 바뀌며, 마지막에는 목소리가 바뀐다. 어떤 아이는 자기 어미의 목소리로 울었고, 어떤 아이는 태어나기도 전에 죽은 조부의 말투로 말을 했다. 현가에서는 그런 아이를 신동이라 부른다.

다만 고는 언젠가 반드시 숙주의 몸을 떠난다. 사람보다 오래 사는 것이 이치에 맞지 않느냐는 것이 현가의 생각이다. 오래된 고일수록 사람의 살과 뼈에 깊이 스며들어, 그것을 꺼낸 뒤에는 무엇이 사람이고 무엇이 벌레였는지 분간하기 어렵다. 현가에서 조상의 시신을 온전히 묻지 않는 까닭이다. 남겨진 몸은 잘게 나누어 고의 먹이로 돌리고, 고가 남긴 허물은 정성껏 말려 집안의 사당에 모신다. 사람이 죽어도 고가 살아 있다면 그 사람은 아직 집안에 남아 있는 셈이다.

현가는 오랫동안 서문이 꺾은 망량의 잔해를 탐냈다. 제령된 망량에게도 미처 사라지지 못한 원념이 남으며, 그것이 고를 기르는 데 더없이 좋은 먹이가 된다는 사실을 알았기 때문이다. 서문이 그것을 부정이라 여겨 불태우면 현가는 재라도 주워 담았다. 염가가 퇴마의 흔적을 지우러 다닐 때에도 현가의 사람들이 몰래 뒤따르는 일이 잦았다. 염가 사람들은 처음에는 그저 뒤처리를 돕는 줄 알았다. 사라진 망량의 흔적이 해마다 늘어난다는 것을 깨달은 것은 한참 뒤의 일이었다.

현가에는 百蠱라는 오래된 숙원이 있다. 백 가지 고를 한 몸에 품으면 그것들이 서로를 잡아먹고 마침내 하나의 고만 남게 된다는 것이다. 그 고는 사람의 육신을 먹지 않고도 사람의 뜻을 삼킬 수 있으며, 살아 있는 자와 죽은 자를 가리지 않고 제 허물을 입힐 수 있다고 전한다. 그러나 아직 백고를 완성한 자는 없다. 완성을 앞두고 몸이 먼저 무너지거나, 사람의 뜻이 먼저 사라졌기 때문이다.

독고가의 술법은 본디 악몽에 시달리는 사람을 구하는 데 쓰였다. 죽은 이의 모습을 밤마다 보는 사람에게는 그 넋이 돌아갈 문을 만들어 주고 원한을 품은 망량이 꿈에 눌러앉으면 그곳에 길을 잃을 만한 미로를 지어 가두었다. 꿈에서 빠져나오지 못하는 혼백을 이끌어 깨우는 것도 그들의 몫이었다. 그러나 남의 꿈에 집을 지을 수 있다면 그 집에 남을 가둘 수도 있다는 사실을 깨닫는 데에는 그리 오랜 시간이 걸리지 않았다. 이후 독고가는 꿈을 고쳐 주는 일보다 망가뜨리는 일로 더 많은 돈을 벌었다.

그들이 내리는 저주는 다른 가문에 비해 더디고 은밀하다. 사람을 앓게 하거나 당장 목숨을 끊는 것이 아니라 잠들 때마다 같은 꿈을 꾸게 만드는 것이다. 처음에는 대수롭지 않다. 낯선 집에 들어가거나, 긴 복도를 걷거나, 누군가를 기다리는 정도다. 그러나 밤이 거듭될수록 꿈에는 방이 늘고, 복도는 길어지며, 들어온 문은 조금씩 멀어진다. 어느 날부터는 꿈속에서 맡은 냄새가 깨어난 뒤에도 남고, 꿈에서 만난 사람의 얼굴이 현실의 지인과 겹친다. 끝내 잠과 깨어 있음의 경계를 잃어버린 사람은 제 손으로 제 삶을 무너뜨린다. 독고가는 이를 두고 저주라 하지 않는다. 그저 오래도록 머물 집을 하나 지어 주었을 뿐이라고 말한다.

    { q: '가문 단위의 큰 소집이나 행사가 있나요?', a: '앞서 말씀드린 제사와 결혼식 · 장례식 등의 대소사 공휴일을 제외하면 김장철에 암묵적으로 모이는 정도입니다' },
    { q: '염업들도 행사에 참여하나요?', a: '조부가 유언으로 그들을 서문의 일족으로 인정하기 전까지는 본가 안채에 발을 들이는 것조차 허락되지 않았습니다' },
    { q: '캐릭터 설정 시 서문 가문이 아닌 타 가문(윤이나 독고 등)으로 지정해도 되나요?', a: '해당 가문일 수밖에 없는 개연성이 있다면 가능합니다 예를 들어 서문OO을 아버지로 하고 독고OO를 어머니로 할 때 두 사람이 이혼 후 독고 가문에서 거주 중이다라는 설정이 있다면 장례식장에 찾아뵙는 정도로 가문의 대소사에 낄 수 있습니다' },
    { q: '서문 가문에서 파가 여러 개로 나뉘어져 있는데 가문의 위계나 관계가 궁금합니다', a: '전통적인 종갓집의 분위기를 떠올리시면 이해가 쉬울 것입니다 일례로 본가의 김장은 대대로 염가의 몫입니다\n\n염가 사람들이 직접 본가까지 내려와 김치를 담그는 식으로 진행합니다 3월에는 동치미를 6월에는 팥을 쑤며 9월에는 전을 부칩니다 11월이 되면 수능을 앞둔 본가의 수험생들에게 찹쌀떡을 만들어 바치는 것도 염가의 일입니다\n\n이것은 단순히 일손을 부리기 위한 관습이 아니며 본가와 염가 사이 존재하는 위계를 해마다 되새기고 그 질서를 다음 세대에까지 각인시키는 일종의 의식에 가깝습니다 염가의 어른들을 본가에 불러 앉혀 허드렛일을 시키고 그 모습을 자식들에게 고스란히 보여 줌으로써 너희가 아무리 나이를 먹고 지위를 얻는다 한들 결국 본가 앞에서는 이 정도의 위치에 불과하다는 사실을 확인시키는 것입니다 그렇게 담근 김치는 경파에까지 택배로 보내집니다 다만 경파에서 그 김치를 실제로 먹는지 아니면 받자마자 내다 버리는지는 본가에서도 알 길이 없습니다' },
    { q: '다음 항렬(3대)는 재x나 도x를 이름에 넣으면 안 되는 등의 규율이 있을까요?', a: '세대마다 작명 방식과 유행이 다르듯 서문 백(조부) 세대에는 돌림자를 사용하는 것이 유행이었다고 가볍게 이해해 주시면 됩니다\n\n다음 항렬에 별도의 작명 규율은 없으나 조부의 이름을 그대로 사용하는 것은 금합니다(ex. 염백)' },
    { q: '겹혼 설정이 현재도 이어지고 있을까요?', a: '확실히 말씀드리자면 서문의 혈통을 이어받지 않아도 결혼은 가능합니다 반드시 겹혼이어야 한다! 는 조금 옛날 풍습이고 현재에 와서는 겹혼을 강제하지는 않으나 서문 백이 윤씨 핏줄과 결혼한 것처럼 퇴마사와 퇴마사의 결혼을 추진하거나 강한 피를 열망하는 이들 사이에서는 겹혼을 하는 것이 유일한 방법으로 먹히기도 합니다!\n\n반드시 겹혼으로만 가능하다 (X)\n\n옛날에는 그랬으나 현재는 보는 눈도 있고 규율이 많이 흐려졌다 (O)' },
    { q: '소지품 커미션이 가능한가요?', a: '커미션은 어떤 경로로든 불가능하며 AI 생성 및 이미 있는 이미지를 가공하여 넣는 것만 가능합니다' },
    { q: '형제지간 사이 관계는 형제지간으로 고정해야 할까요?', a: '다 괜찮습니다 안내드린 것처럼「 삼사라 」는 마지막 불꽃놀이마냥 원하는 취향을 때려 박아 만든 밴드이기 때문에 성의 없는 프로필을 제외하고는 플레이어 여러분의 설정 및 관계에 일절 개입하지 않을 예정입니다!' }
  ]};
</script>
<script>
App.ready.then(() => {
  const W = WORLD;
  $('#w-title').innerHTML = [...W.title].map((c, i) => `<span style="--i:${i}">${esc(c)}</span>`).join('');
  $('#w-sub').textContent = W.sub; $('#w-lead').textContent = W.lead;
  if (window.HeroLoop) HeroLoop.start($('.w-hero'));
  $('#prologue').innerHTML = `${esc(W.prologue)}<span class="by">${esc(W.prologueBy)}</span>`;
  const paras = t => t.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p =>
    p.startsWith('> ') ? `<p class="bq">${esc(p.slice(2))}</p>`
      : p.startsWith('~ ') ? `<p class="fin">${esc(p.slice(2)).replace(/\n/g, '<br>')}</p>`
      : p === '*' ? '<p class="sep" aria-hidden="true">✦</p>'
      : p.startsWith('[') ? `<p class="nt">${esc(p)}</p>` : `<p>${esc(p)}</p>`).join('')
    .replace(/==(.+?)==/g, '<mark class="hl">$1</mark>');   // ==문장== 은 형광펜 밑줄이 그어져요

  /* ---------- 이야기 ---------- */
  $('#story-row').innerHTML = W.stories.map((s, i) => `
    <button class="scard" data-story="${i}"><span class="bgh">${esc(s.han)}</span>
      <span class="vt"><b>${esc(s.vol)}</b>${esc(s.title)}</span>
      <span class="inner"><small>${esc(s.vol)} · CHAPTER ${pad2(i + 1)}</small><h3>${esc(s.title)}</h3><p>${esc(s.teaser)}</p><span class="go">READ ▸</span></span></button>`).join('');
  function openStory(i, origin) {
    $$('.reader').forEach(r => r.remove());
    if (window.Haunt) Haunt.stop();
    const s = W.stories[i];
    const r = document.createElement('div'); r.className = 'reader';
    if (origin) { const b = origin.getBoundingClientRect(); r.style.setProperty('--ox', (b.left + b.width / 2) + 'px'); r.style.setProperty('--oy', (b.top + b.height / 2) + 'px'); }
    r.innerHTML = `<div class="rd-prog"><i></i></div><button class="rd-x">CLOSE ✕</button>
      <aside class="rd-side"><div class="big">${esc(s.han)}</div><div class="vol">${esc(s.vol)} · ${pad2(i + 1)} / ${pad2(W.stories.length)}</div></aside>
      <article class="rd-main"><div class="meta">${esc(s.vol)} · CHAPTER ${pad2(i + 1)}</div><h2>${esc(s.title)}</h2><div class="rule"></div>
        <div class="rd-text">${paras(s.body)}</div><div class="rd-sign">— 기록 끝</div>
        <div class="rd-nav">${i > 0 ? `<button class="btn ghost" data-sto="${i - 1}">‹ ${esc(W.stories[i - 1].title)}</button>` : '<span></span>'}
          ${i < W.stories.length - 1 ? `<button class="btn" data-sto="${i + 1}">${esc(W.stories[i + 1].title)} ›</button>` : ''}</div></article>`;
    document.body.appendChild(r); document.body.classList.add('no-scroll');
    const main = $('.rd-main', r), ps = $$('.rd-text p', r);
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { root: main, threshold: .1 });
    ps.forEach((p, k) => { p.style.transitionDelay = (k < 3 ? .5 + k * .25 : 0) + 's'; io.observe(p); });
    main.addEventListener('scroll', () => { const p = main.scrollTop / Math.max(1, main.scrollHeight - main.clientHeight); $('.rd-prog i', r).style.width = (p * 100) + '%'; });
    // 卷三은 망량이 끼어들어요 (assets/js/haunt.js)
    if (s.haunt && window.Haunt) Haunt.start(r);
    const close = () => { if (window.Haunt) Haunt.stop(); r.classList.add('out'); setTimeout(() => { r.remove(); document.body.classList.remove('no-scroll'); }, 550); };
    $('.rd-x', r).onclick = close;
    r.onclick = e => { const b = e.target.closest('[data-sto]'); if (b) openStory(+b.dataset.sto, b); };
    r._k = e => { if (!document.body.contains(r)) return removeEventListener('keydown', r._k); if (e.key === 'Escape') close(); };
    addEventListener('keydown', r._k);
  }
  // 卷一 은 여는 영상이 먼저 나오고, 먹 안개로 덮인 사이에 이야기 창이 열려요 (assets/js/intro.js)
  $('#story-row').onclick = e => {
    const c = e.target.closest('[data-story]'); if (!c) return;
    const i = +c.dataset.story, s = W.stories[i];
    if (s.intro && window.Intro) Intro.play(s.intro, () => openStory(i, null)); else openStory(i, c);
  };
  if (window.Intro) { W.stories.forEach(s => { if (s.intro) setTimeout(() => Intro.preload(s.intro), 1500); }); }

  /* ---------- 지역 ---------- */
  $('#region-grid').innerHTML = W.regions.map((g, i) => `
    <button class="rcard ${g.tone ? 'ht-' + g.tone : ''}" data-reveal data-region="${i}" style="--d:${i * .08}s"><span class="rh">${esc(g.han)}</span><span class="glare"></span>
      <span class="dir">${esc(g.dir)}</span><span class="num">${pad2(i + 1)}</span>
      <span class="bt"><h3>${esc(g.name)}${g.hj ? `<small class="hj">${esc(g.hj)}</small>` : ''}</h3><p>${esc(g.short || g.moods.join(' · '))}</p><span class="open">OPEN RECORD ▸</span></span></button>`).join('');
  const fine = matchMedia('(pointer:fine)').matches && !REDUCED;
  $('#region-grid').addEventListener('pointermove', e => {
    const c = e.target.closest('.rcard'); if (!c || !fine) return;
    const b = c.getBoundingClientRect(), x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
    c.style.setProperty('--ry', ((x - .5) * 14) + 'deg'); c.style.setProperty('--rx', ((.5 - y) * 12) + 'deg');
    c.style.setProperty('--mx', x * 100 + '%'); c.style.setProperty('--my', y * 100 + '%');
  });
  $('#region-grid').addEventListener('pointerout', e => { const c = e.target.closest('.rcard'); if (c && !c.contains(e.relatedTarget)) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); } });
  $('#region-grid').onclick = e => {
    const c = e.target.closest('[data-region]'); if (!c) return;
    const g = W.regions[+c.dataset.region];
    const back = document.createElement('div'); back.className = 'drawer-back';
    const d = document.createElement('aside'); d.className = 'drawer' + (g.tone ? ' ht-' + g.tone : '');
    d.innerHTML = `<button class="dx">CLOSE ✕</button>
      <div class="dh"><span class="big">${esc(g.han)}</span><div><small>${esc(g.dir)} · HOUSE ${pad2(+c.dataset.region + 1)}</small><h3>${esc(g.name)}${g.hj ? `<small class="hj">${esc(g.hj)}</small>` : ''}</h3></div></div>
      <div class="db">${g.moods.length ? `<div class="moods">${g.moods.map(m => `<span>${esc(m)}</span>`).join('')}</div>` : ''}
        ${g.text ? `<div class="dtext">${paras(g.text)}</div>` : ''}
        ${g.map && window.seoulMap ? `<div><div class="lbl2">${esc(g.list)}</div>${seoulMap()}</div>` : ''}
        ${g.items.length ? `<div><div class="lbl2">${esc(g.list)}</div><ul class="places recs">${g.items.map((it, k) => `<li data-rec="${k}" tabindex="0" role="button"><i class="dm"></i><div><strong>${esc(it.title)}</strong><p>눌러서 읽기 ▸</p></div></li>`).join('')}</ul></div>`
          : !g.text && !g.map ? '<p class="d-empty">아직 남은 기록이 없어요.</p>' : ''}</div>`;
    document.body.append(back, d); document.body.classList.add('no-scroll');
    if (g.map && window.seoulMapBind) seoulMapBind(d);
    // 항목을 누르면 그 기록이 창으로 떠요
    const openRec = k => {
      const it = g.items[k];
      openModal(`<div class="rec-pop"><small>${esc(g.name)} · ${esc(g.list)}</small><h2>${esc(it.title)}</h2>${it.body ? `<div class="rec-body">${paras(it.body)}</div>` : ''}</div>`, 'rec-modal' + (g.tone ? ' ht-' + g.tone : ''));
    };
    // 누른 항목의 마름모에 빛이 들어와요 (예전 연대기 효과)
    const light = li => { d.querySelectorAll('[data-rec]').forEach(x => x.classList.toggle('on', x === li)); };
    d.addEventListener('click', e => { const li = e.target.closest('[data-rec]'); if (li) { light(li); openRec(+li.dataset.rec); } });
    d.addEventListener('keydown', e => { const li = e.target.closest('[data-rec]'); if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); light(li); openRec(+li.dataset.rec); } });
    const close = () => { d.classList.add('out'); back.remove(); setTimeout(() => { d.remove(); document.body.classList.remove('no-scroll'); }, 380); };
    back.onclick = close; $('.dx', d).onclick = close;
    d._k = e => { if (!document.body.contains(d)) return removeEventListener('keydown', d._k, true); if (e.key === 'Escape' && !$('.modal-back')) close(); };   // 기록 창이 떠 있으면 Esc 는 창만 닫아요
    addEventListener('keydown', d._k, true);
  };

  /* ---------- 가계도 ---------- */
  if (window.renderFamily) { $('#fm-title').textContent = FAMILY.title || '가계도'; renderFamily($('#fm-tree')); }

  /* ---------- 용어 ---------- */
  $('#lex-grid').innerHTML = W.lexicon.map((l, i) => `
    <button class="lcard" data-reveal style="--d:${i * .06}s"><span class="flip">
      <span class="side front"><i class="no">${pad2(i + 1)}</i><i class="k tl"></i><i class="k br"></i><b>${esc(l.han)}</b><span>${esc(l.ko)}</span><i class="hint">TAP</i></span>
      <span class="side back"><i class="k tl"></i><i class="k br"></i><strong><em>${esc(l.han)}</em>${esc(l.ko)}</strong><span class="mn">${esc(l.mean)}</span></span></span></button>`).join('');
  $('#lex-grid').onclick = e => { const c = e.target.closest('.lcard'); if (c) c.classList.toggle('on'); };

  /* ---------- 지도 ----------
     동양풍 게임 지도: 왼쪽 판(현재 위치 · 설명 · 이동 지역 카드) / 가운데 위 '영역 지도' 현판 / 연꽃 표식 (누르면 연하게 빛나요)
     아래 '장소 설명' 판(설명이 타자 치듯 · 뒤에 그 장소의 한자가 먹글씨로 은은하게) */
  if (W.maps && W.maps.length) {
    let cur = 0, open = -1, typeT = 0;
    const stage = $('#wm-stage'); $('#wm-tabs').remove();   // 지도 고르기는 왼쪽 '이동 지역' 카드로
    const LOTUS = `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 2 L46 24 L24 46 L2 24 Z" fill="rgba(9,14,32,.78)" stroke="currentColor" stroke-width="1.3"/><path d="M24 6.5 L41.5 24 L24 41.5 L6.5 24 Z" fill="none" stroke="currentColor" stroke-width=".6" opacity=".55"/><g fill="currentColor"><path d="M24 .6l1.4 1.4-1.4 1.4-1.4-1.4zM24 44.6l1.4 1.4-1.4 1.4-1.4-1.4zM.6 24l1.4-1.4 1.4 1.4-1.4 1.4zM44.6 24l1.4-1.4 1.4 1.4-1.4 1.4z"/><path d="M24 11.5c3.2 3.6 3.4 9.2 0 13.6-3.4-4.4-3.2-10 0-13.6z"/><path d="M24 25.1c-4.8.4-8.8-2.2-10.2-6.6 4.5-.4 8.3 2.2 10.2 6.6z" opacity=".9"/><path d="M24 25.1c4.8.4 8.8-2.2 10.2-6.6-4.5-.4-8.3 2.2-10.2 6.6z" opacity=".9"/><path d="M24 25.6c-4.1 2.7-8.7 3-12.2 1.1 3.3-2.6 8-3 12.2-1.1z" opacity=".7"/><path d="M24 25.6c4.1 2.7 8.7 3 12.2 1.1-3.3-2.6-8-3-12.2-1.1z" opacity=".7"/><circle cx="24" cy="34.4" r="1.2"/></g><path d="M16.5 30.6c2.4 1.6 4.9 2.3 7.5 2.3s5.1-.7 7.5-2.3" fill="none" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/></svg>`;
    const MOON = `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.5 2.5a8 8 0 1 0 4 14.4A7 7 0 0 1 13.5 2.5z" fill="currentColor"/></svg>`;
    const label = mm => `<span class="rg">${esc(mm.name)}</span>${mm.house ? `<i class="bar" aria-hidden="true"></i><span class="hs">${esc(mm.house)}</span>` : ''}`;
    const typeIn = (box, text) => {
      clearInterval(typeT);
      const ps = String(text).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      box.innerHTML = ps.map(() => '<p></p>').join(''); const els = $$('p', box);
      if (REDUCED) { els.forEach((el, k) => el.textContent = ps[k]); return; }
      let k = 0, n = 0;
      typeT = setInterval(() => {
        if (k >= ps.length) return clearInterval(typeT);
        n += 2; els[k].textContent = ps[k].slice(0, n); els[k].classList.add('cur');
        if (n >= ps[k].length) { els[k].classList.remove('cur'); k++; n = 0; }
      }, 24);
    };
    const select = k => {
      const m = W.maps[cur], sp = m.spots[k]; open = sp ? k : -1;
      $$('.wm-pin', stage).forEach((el, j) => el.classList.toggle('on', j === open));
      $('.wm-here b', stage).textContent = sp ? sp.name : m.name + (m.house ? ' · ' + m.house : '');
      $('.wm-here small', stage).textContent = sp ? (sp.tag || '장소') : '지도를 둘러보는 중';
      $('.wm-intro', stage).textContent = sp ? `${m.name} · ${pad2(k + 1)} / ${pad2(m.spots.length)}` : `표식 ${m.spots.length}곳이 기록되어 있어요. 연꽃 표식을 눌러 보세요.`;
      const rec = $('.wm-rec', stage);
      if (!sp) { clearInterval(typeT); rec.classList.remove('in'); return; }
      $('.wm-rec .wm-ink', stage).textContent = sp.han || '';
      $('.wm-rec h4 span', stage).textContent = sp.name;
      $('.wm-rec .hj', stage).textContent = sp.han || '';
      rec.classList.remove('in'); void rec.offsetWidth; rec.classList.add('in');
      typeIn($('.wm-rec .wm-tx', stage), sp.text || '');
    };
    const showMap = i => {
      cur = i; open = -1; const m = W.maps[i];
      stage.innerHTML = `<div class="wm-game">
        <aside class="wm-side">
          <span class="wm-tassel l" aria-hidden="true"></span>
          <div class="wm-lbl">현재 위치</div>
          <div class="wm-here"><span class="em" aria-hidden="true">${LOTUS}</span><div><b>${esc(m.name)}${m.house ? ' · ' + esc(m.house) : ''}</b><small>지도를 둘러보는 중</small><em><i></i>연결됨</em></div></div>
          <div class="wm-btns"><button type="button" data-go="-1">이전 장소</button><button type="button" class="on" data-go="1">${LOTUS}다음 장소</button></div>
          <p class="wm-intro"></p>
          <div class="wm-lbl sm"><span aria-hidden="true">✿</span>이동 지역</div>
          <div class="wm-areas">${W.maps.map((mm, j) => `<button type="button" class="wm-area${j === i ? ' on' : ''}" data-map="${j}" style="background-image:url('${esc(mm.img)}')"><span class="nmx">${label(mm)}</span><i aria-hidden="true">${j === i ? '◆' : '◇'}</i></button>`).join('')}</div>
        </aside>
        <div class="wm-view">
          <img src="${esc(m.img)}" alt="${esc(m.name)} 지도" decoding="async">
          <div class="wm-plaque" aria-hidden="true"><span class="ms l">${MOON}</span><b>${esc(m.house || m.name)}</b><span class="ms r">${MOON}</span><small>${esc(m.house ? m.name : '')}</small><span class="dia"><i>◇</i><i>◆</i><i>◇</i></span></div>
          <div class="wm-pins">${m.spots.map((sp, k) => `<button type="button" class="wm-pin${sp.danger ? ' danger' : ''}" data-spot="${k}" style="left:${sp.x}%;top:${sp.y}%;--d:${k * .1}s" aria-label="${esc(sp.name)}"><span class="ring" aria-hidden="true"></span>${LOTUS}<span class="nm">${esc(sp.name)}</span></button>`).join('')}${m.spots.map(sp => sp.danger ? `<span class="wm-alert danger in${sp.x > 70 ? ' left' : ''}" style="left:${sp.x}%;top:${sp.y}%" aria-hidden="true"><i>!</i>${esc(sp.alert || '이상')}</span>` : '').join('')}</div>

          <div class="wm-rec" aria-live="polite">
            <div class="wm-rec-h">장소 설명<button type="button" class="wm-x" aria-label="닫기">✕</button></div>
            <div class="wm-rec-b"><span class="wm-ink" aria-hidden="true"></span><i class="wm-fret" aria-hidden="true"></i>
              <h4>${MOON}<span></span><em class="hj"></em></h4><div class="wm-tx"></div></div>
          </div>
        </div></div>`;
      select(-1);
    };
    stage.addEventListener('click', e => {
      const a = e.target.closest('[data-map]'); if (a) return showMap(+a.dataset.map);
      const p = e.target.closest('[data-spot]'); if (p) return select(+p.dataset.spot === open ? -1 : +p.dataset.spot);
      if (e.target.closest('.wm-x')) return select(-1);
      const g = e.target.closest('[data-go]'); if (g) { const n = W.maps[cur].spots.length; return select(open < 0 ? (+g.dataset.go > 0 ? 0 : n - 1) : (open + +g.dataset.go + n) % n); }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && open >= 0 && !$('.reader, .drawer, .modal-back')) select(-1); });
    W.maps.forEach(m => { const im = new Image(); im.src = m.img; });   // 지역을 바꿀 때 바로 뜨게 미리 받아 둬요
    showMap(0);
  }
  /* ---------- 질문 모음 ----------
     질문을 누르면 아래로 답이 한 글자씩 타자 치듯 나와요 (다시 누르면 접혀요) */
  if (W.qna && W.qna.length) {
    const list = $('#qa-list');
    list.innerHTML = W.qna.map((it, i) => `<div class="qa" data-reveal style="--d:${i * .05}s">
      <button type="button" class="qa-q" aria-expanded="false"><span class="qa-n">Q${pad2(i + 1)}</span><span class="qa-t">${esc(it.q)}</span><i class="qa-i" aria-hidden="true"></i></button>
      <div class="qa-a" hidden><span class="qa-n">A.</span><div class="qa-body"></div></div></div>`).join('');
    const type = (box, text) => {
      clearInterval(box._t);
      const ps = String(text).split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
      box.innerHTML = ps.map(() => '<p></p>').join(''); const els = $$('p', box);
      if (REDUCED) { els.forEach((p, k) => p.textContent = ps[k]); return; }
      let k = 0, n = 0; box.classList.add('typing');
      box._t = setInterval(() => {
        if (k >= ps.length) { clearInterval(box._t); box.classList.remove('typing'); return; }
        n += 2; els[k].textContent = ps[k].slice(0, n); els[k].classList.add('cur');
        if (n >= ps[k].length) { els[k].classList.remove('cur'); k++; n = 0; }
      }, 28);
    };
    list.onclick = e => {
      const b = e.target.closest('.qa-q'); if (!b) return;
      const qa = b.parentElement, a = $('.qa-a', qa), i = [...list.children].indexOf(qa), on = !qa.classList.contains('on');
      qa.classList.toggle('on', on); b.setAttribute('aria-expanded', on); a.hidden = !on;
      if (on) type($('.qa-body', qa), W.qna[i].a); else clearInterval($('.qa-body', qa)._t);
    };
  }

  /* 서브 메뉴 현재 위치 */
  const links = $$('#w-nav a'), secs = $$('.w-sec');
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id)); }), { rootMargin: '-40% 0px -55% 0px' });
  secs.forEach(s => io.observe(s));
  reveal();
});
</script>
</body>
</html>
